camera:
  width: 640
  height: 480
  framerate: 30
  device_index: 0
  use_picamera: false
  rotation_deg: 0
  source: opencv
  flip_horizontal: false
  flip_vertical: false
  analog_profile: ntsc
  analog_profiles:
    ntsc:
      device: /dev/video0
      width: 640
      height: 480
      framerate: 30
      standard: NTSC
      input_channel: 0
    pal_longbow:
      device: /dev/video1
      width: 720
      height: 576
      framerate: 25
      standard: PAL
      input_channel: 0

tracker:
  max_corners: 150
  quality_level: 0.01
  min_distance: 7
  block_size: 7
  win_size: 21
  pyramids: 3
  reinit_threshold: 0.35
  roi: [80, 60, 480, 360]

pan_pid:
  kp: 0.08
  ki: 0.02
  kd: 0.015
  integrator_limit: 0.3
  output_limit: 0.8
  deadband: 0.01

tilt_pid:
  kp: 0.09
  ki: 0.025
  kd: 0.016
  integrator_limit: 0.3
  output_limit: 0.8
  deadband: 0.01

pan_actuator:
  pin: 18
  neutral_pulse_us: 1490
  min_pulse_us: 1100
  max_pulse_us: 1900
  rate_limit_us: 120
  simulate: true

tilt_actuator:
  pin: 19
  neutral_pulse_us: 1510
  min_pulse_us: 1100
  max_pulse_us: 1900
  rate_limit_us: 150
  simulate: true

control_rate_hz: 25.0
preview: false
log_path: telemetry.csv
manual_input:
  enabled: false
  device: null
  mode: gamepad
  roll_axis: ABS_X
  pitch_axis: ABS_Y
  axis_min: -32768
  axis_max: 32767
  deadband: 0.05
  scale: 0.4
  fail_safe_timeout_s: 1.5

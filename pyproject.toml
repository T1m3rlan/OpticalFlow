[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "betafly-stabilizer"
version = "0.1.0"
description = "Optical position hold loop for Betaflight drones running on Raspberry Pi Zero"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.8",
    "pyserial>=3.5",
    "PyYAML>=6.0",
]

[project.scripts]
betafly-stabilizer = "betafly_stabilizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
